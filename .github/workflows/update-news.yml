name: Update NOVA News Feed

on:
  schedule:
    # Her gün 06:23 Türkiye saati.
    # GitHub cron ifadelerini UTC olarak değerlendirir.
    - cron: "23 3 * * *"

  # Actions ekranından manuel çalıştırmaya izin verir.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-news-update
  cancel-in-progress: true

jobs:
  update-news:
    name: Fetch and publish news
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Fetch latest news
        run: npm run update-news

      - name: Validate generated JSON
        run: |
          node -e "
            const fs = require('fs');
            const feed = JSON.parse(
              fs.readFileSync('data/news.json', 'utf8')
            );

            if (!Array.isArray(feed.articles)) {
              throw new Error('articles must be an array');
            }

            if (!feed.generatedAt) {
              throw new Error('generatedAt is missing');
            }

            console.log(
              'Feed validation successful:',
              feed.total,
              'articles'
            );
          "

      - name: Commit updated feed
        run: |
          git config user.name "nova-news-bot"
          git config user.email "nova-news-bot@users.noreply.github.com"

          git add data/news.json package-lock.json

          if git diff --cached --quiet; then
            echo "No file changes detected."
            exit 0
          fi

          git commit -m "chore: update daily news feed"
          git push
